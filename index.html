
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BRAIQ | QUANTUM TERMINAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Montserrat:ital,wght@0,400;0,700;0,900;1,700;1,900&family=Michroma&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              broker: {
                bg: '#242325',
                light: '#F9FAF6',
                green: '#1DF096',
                purple: '#7711AA',
                pink: '#F31B80',
                cyan: '#82EAFF',
              }
            },
            fontFamily: {
              sans: ['Montserrat', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
              logo: ['Michroma', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      body {
        background: linear-gradient(135deg, #242325 0%, #171418 100%);
        color: #F9FAF6;
        font-family: 'Montserrat', sans-serif;
        overflow-x: hidden;
        min-height: 100vh;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: #242325; 
      }
      ::-webkit-scrollbar-thumb {
        background: #333; 
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #F31B80; 
      }
      .sharp-edge {
        border-radius: 0px !important;
      }
      input[type="range"] {
        -webkit-appearance: none;
        background: rgba(255,255,255,0.05);
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 12px;
        height: 12px;
        background: #F31B80;
        cursor: pointer;
        border: none;
      }
      
      /* Shimmer Animation for focused inputs */
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      .shimmer-focus:focus {
        background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%);
        background-size: 200% 100%;
        animation: shimmer 2s infinite linear;
      }

      /* Numbers only use mono */
      .num-font { font-family: 'JetBrains Mono', monospace; }
      .text-font { font-family: 'Montserrat', sans-serif; }
      
      /* BRAIQ Extended Logo Look */
      .braiq-logo {
        font-family: 'Michroma', sans-serif;
        letter-spacing: -0.05em;
        text-transform: uppercase;
      }

      /* Typography Rules */
      p, div, span, select, input, button {
        text-align: justify;
      }
      h1, h2, h3, h4, h5, h6 {
        text-align: center;
        margin-bottom: 1.5em;
      }
      p {
        margin-bottom: 2em;
        max-width: 60ch;
        margin-left: auto;
        margin-right: auto;
      }
    </style>
  <script type="importmap">
{
  "imports": {

    "framer-motion": "https://esm.sh/framer-motion@^12.29.0"
  }
}
</script>
